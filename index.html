  <script>
/**
 * Simple Navigation Guard
 * Prevents access to info page unless logged in, 
 * and stays silent if you're already on that page.
 */
document.addEventListener('click', function(e) {
 let link = e.target.closest('a');
 
 if (link && link.href.includes('userInformationPage')) {
 // Condition: Not logged in AND not currently on the information page
 if (sessionStorage.getItem('isLoggedIn') !== 'true' && !window.location.href.includes('userInformationPage')) {
 e.preventDefault();
 
 let err = document.getElementById('menuError');
 if (!err) {
 err = document.createElement('div');
 err.id = 'menuError';
 // Clean floating style
 err.style = "position:fixed; bottom:20px; right:20px; background:#d9534f; color:white; padding:10px 20px; border-radius:5px; font-weight:bold; z-index:9999;";
 document.body.appendChild(err);
 }
 
 err.innerText = "Please login first to access this page.";
 err.style.display = 'block';
 
 // Auto-hide after 3 seconds
 setTimeout(() => { err.style.display = 'none'; }, 3000);
 }
 }
});
</script>
<script>
/**
* Function to validate login credentials
* Matches the username 'Shuruq' and specific password
*/
function checkLogin() {
// Get values from the input fields
var user = document.getElementById('userInput').value;
var pass = document.getElementById('passInput').value;

// Check if credentials match
if (user === "Shuruq" && pass === "MA005500@#&*SQ") {
// Redirect to the information page if correct
window.location.href = 'userInformationPage.html';
} else {
// Show error message if incorrect
var errorElement = document.getElementById('errorMsg');
if (errorElement) {
errorElement.style.display = 'block';
} else {
alert("Invalid username or password!");
}
}
}
</script>
